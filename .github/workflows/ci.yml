name: Foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the locked environment
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python errors
        run: ruff check app.py request_validation.py web_security.py weather tests scripts/check_ecmwf_live.py --select E9,F
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check source geometry reference locations
        run: python scripts/check_phase0_domain.py
      - name: Audit locked runtime packages
        run: pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off
