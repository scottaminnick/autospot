{% extends "base.html" %}
{% block title %}AutoSpot request{% endblock %}
{% block content %}
<main class="container">
  <h1>NWSI 10-813 Spot Forecast Generator</h1>
  <form action="{{ url_for('web.submit', simple=True) }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="model">Model Routing</label>
    <select id="model" name="model_choice">
      <option value="ECMWF" selected>ECMWF IFS (global 0.25°)</option>
      <option value="GFS" disabled>GFS (unavailable)</option>
    </select>
    <div class="flex-row">
      <div class="flex-col">
        <label for="latitude">Latitude (negative for south)</label>
        <input id="latitude" type="number" name="latitude" min="-90" max="90" step="any" required>
      </div>
      <div class="flex-col">
        <label for="longitude">Longitude (negative for west)</label>
        <input id="longitude" type="number" name="longitude" min="-180" max="180" step="any" required>
      </div>
    </div>
    <div class="flex-row">
      <div class="flex-col">
        <label for="start_date">Valid start date (UTC)</label>
        <input id="start_date" type="date" name="start_date" value="{{ values.start_date }}" required>
      </div>
      <div class="flex-col">
        <label for="start_hour">Valid start hour (UTC)</label>
        <select id="start_hour" name="start_hour">
          {% for hour in range(24) %}{% set value = '%02d' % hour %}
          <option value="{{ value }}" {% if values.start_hour == value %}selected{% endif %}>{{ value }}Z</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="flex-row">
      <div class="flex-col">
        <label for="duration">Forecast Duration</label>
        <select id="duration" name="duration">
          {% for hours in [12, 24, 36] %}
          <option value="{{ hours }}" {% if values.duration == hours|string %}selected{% endif %}>{{ hours }} hours</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex-col">
        <label for="sar_name">SAR Name / Label</label>
        <input id="sar_name" type="text" name="sar_name" maxlength="120" value="{{ values.sar_name }}">
      </div>
    </div>
    <button type="submit">Generate Report</button>
  </form>
</main>
{% endblock %}
