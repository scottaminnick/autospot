{% extends "base.html" %}
{% block title %}AutoSpot request{% endblock %}
{% block content %}
<main class="container">
  <h1>Aviation Spot Forecast Generator</h1>
  <form action="{{ url_for('web.submit') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="model">Model guidance</label>
    <select id="model" name="model_choice">
      {% for model in ['ECMWF', 'GFS'] %}
      <option value="{{ model }}" {% if values.model_choice == model %}selected{% endif %}>{{ model }} (global 0.25°)</option>
      {% endfor %}
    </select>
    <div class="flex-row">
      <div class="flex-col">
        <label for="latitude">Latitude (negative for south)</label>
        <input id="latitude" type="number" name="latitude" min="-90" max="90" step="any" required>
      </div>
      <div class="flex-col">
        <label for="longitude">Longitude (negative for west)</label>
        <input id="longitude" type="number" name="longitude" min="-180" max="180" step="any" required>
      </div>
    </div>
    <div class="flex-row">
      <div class="flex-col">
        <label for="start_date">Valid start date (UTC)</label>
        <input id="start_date" type="date" name="start_date" value="{{ values.start_date }}" required>
      </div>
      <div class="flex-col">
        <label for="start_hour">Valid start hour (UTC)</label>
        <select id="start_hour" name="start_hour">
          {% for hour in range(24) %}{% set value = '%02d' % hour %}
          <option value="{{ value }}" {% if values.start_hour == value %}selected{% endif %}>{{ value }}Z</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <label for="duration">Duration (hours, 1–72)</label>
    <input id="duration" type="number" name="duration" min="1" max="72" step="1" list="durations" value="{{ values.duration }}" required>
    <datalist id="durations">{% for n in [12, 24, 36, 48, 72] %}<option value="{{ n }}">{% endfor %}</datalist>
    <label for="sar_name">Operation name / label</label>
    <input id="sar_name" type="text" name="sar_name" maxlength="120" value="{{ values.sar_name }}">
    <button type="submit">Generate draft</button>
  </form>
</main>
{% endblock %}
